<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>团队数据看板</title>
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo-dot"></span> 团队数据看板</div>
    <nav class="nav">
      <a href="index.html" class="active">首页</a>
      <a href="mydata.html">我的数据</a>
      <a href="upload2.html">上传数据</a>
    </nav>
    <button id="themeToggle" class="theme-toggle" aria-label="切换主题">深色模式</button>
  </header>

  <main class="container">
    <section class="hero glass">
      <h1>把团队数据，变成一眼看懂的看板</h1>
      <p class="muted">分人分域上传 Excel，看板立刻读得到。有链接即可访问，无需注册、无需登录、无需服务器。</p>
      <div class="hero-actions">
        <a href="app.html" class="btn primary">进入统一工作台</a>
        <a href="upload2.html" class="btn">上传 Excel</a>
      </div>
    </section>

    <section class="grid">
      <a href="app.html" class="card glass">
        <div class="ico"></div>
        <h3>统一工作台（推荐）</h3>
        <p class="muted">上传数据、销售看板、大盘全部在一个界面里切换，左侧导航一站式搞定，无需在多个页面间跳。</p>
      </a>
      <a href="dash.html" class="card glass">
        <div class="ico"></div>
        <h3>大盘（独立页）</h3>
        <p class="muted">大盘流量与销售转化模块，独立页面版本。</p>
      </a>
    </section>

    <p class="muted" style="text-align:center;margin-top:8px;font-size:13px">
      注：「运营看板（vendor-dash 风格）」需配合本地 Node 服务，后续会出纯静态版。
    </p>
  </main>

  <footer class="footer muted">有链接即可访问 · 无需注册登录</footer>
  <script src="js/app.js?v=5"></script>
</body>
</html>
