<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上传数据 · 团队看板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="mydata.html">我的数据</a>
      <a href="upload2.html" class="active">上传数据</a>
    </nav>
    <button id="themeToggle" class="theme-toggle">深色模式</button>
  </header>

  <main class="container">
    <section class="hero glass">
      <h1>上传数据</h1>
      <p class="muted">选数据域 → 传 Excel/CSV → 自动存进云端数据库，看板立刻能读。任何人打开链接就能传，无需登录、无需注册。</p>
    </section>

    <section class="card glass" style="max-width:640px;margin:0 auto">
      <form id="upForm">
        <div class="fitem" style="margin-bottom:16px">
          <label>数据域（这块数据归到哪）</label>
          <select id="domain" name="domain" required>
            <option value="sales">销售域</option>
            <option value="returns">退货域</option>
            <option value="price">价格域</option>
            <option value="inventory">库存域</option>
          </select>
        </div>
        <div class="fitem" style="margin-bottom:16px">
          <label>Excel / CSV 文件</label>
          <input type="file" id="file" name="file" accept=".xlsx,.xls,.csv" required />
        </div>
        <div class="fitem" style="margin-bottom:20px">
          <label>更新人（可选，记一笔谁传的）</label>
          <input type="text" id="by" name="by" placeholder="如：张三" />
        </div>
        <button type="submit" class="btn primary" id="submitBtn">存入仓库</button>
        <span id="status" class="muted" style="margin-left:12px"></span>
      </form>
      <div id="result" class="glass" style="margin-top:20px;padding:16px;display:none;border-radius:14px"></div>
    </section>

    <p class="muted" style="text-align:center;margin-top:24px;font-size:13px">
      传完后去 <a href="mydata.html">「我的数据」</a> 看板，选同一个域即可看到刚传的内容。
    </p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-api.js"></script>
  <script src="js/upload2.js"></script>
</body>
</html>
