<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的数据 · 团队看板</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/vendor/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a href="/">首页</a>
      <a href="/mydata.html" class="active">我的数据</a>
      <a href="/upload2.html">上传数据</a>
    </nav>
    <button id="themeToggle" class="theme-toggle">深色模式</button>
  </header>

  <main class="container">
    <section class="hero glass">
      <h1>我的数据看板</h1>
      <p class="muted">选一个数据域，读取仓库里大家传的最新数据，立刻出 KPI 与图表。查看无需登录；上传时登录可记录更新人。</p>
      <div id="authGate" style="margin-top:12px"></div>
    </section>

    <div class="filterbar" style="border-radius:14px;margin-bottom:22px">
      <div class="fitem">
        <label>数据域</label>
        <select id="domain">
          <option value="sales">销售域</option>
          <option value="returns">退货域</option>
          <option value="price">价格域</option>
          <option value="inventory">库存域</option>
        </select>
      </div>
      <button id="loadBtn" class="btn primary sm">读取数据</button>
      <span id="updated" class="muted" style="align-self:center"></span>
    </div>

    <div id="empty" class="card glass" style="text-align:center;padding:40px">
      <p class="muted">还没有数据。去 <a href="/upload2.html">上传数据</a> 传一份试试。</p>
    </div>

    <div id="board" style="display:none">
      <div class="kpi-grid cols5" id="kpis"></div>
      <div class="charts-2" style="margin-top:20px">
        <div class="chart-wrap glass"><h3 id="chartTitle">分布</h3><canvas id="barChart" height="260"></canvas></div>
        <div class="chart-wrap glass" style="padding:16px;overflow:auto;max-height:340px">
          <h3>数据预览（前 50 行）</h3>
          <div id="tableWrap" style="font-size:12px"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/github-api.js"></script>
  <script src="/js/mydata.js"></script>
</body>
</html>
