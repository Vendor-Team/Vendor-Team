<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的数据 · 团队看板</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <script src="vendor/chart.umd.min.js?v=3"></script>
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="mydata.html" class="active">我的数据</a>
      <a href="upload2.html">上传数据</a>
    </nav>
    <button id="themeToggle" class="theme-toggle">深色模式</button>
  </header>

  <main class="container">
    <section class="hero glass">
      <h1>我的数据看板</h1>
      <p class="muted">选一个数据域，读取云端大家传的最新数据，立刻出 KPI 与图表。无需登录即可查看。</p>
    </section>

    <div class="filterbar" style="border-radius:14px;margin-bottom:22px">
      <div class="fitem">
        <label>数据域</label>
        <select id="domain">
          <option value="sales">销售域</option>
          <option value="returns">退货域</option>
          <option value="price">价格域</option>
          <option value="inventory">库存域</option>
        </select>
      </div>
      <div class="fitem">
        <label>数据源（上传批次）</label>
        <select id="fileTagFilter"><option value="">全部</option></select>
      </div>
      <div class="fitem">
        <label>月份</label>
        <select id="monthFilter"><option value="">全部</option></select>
      </div>
      <button id="loadBtn" class="btn primary sm">读取数据</button>
      <span id="updated" class="muted" style="align-self:center"></span>
    </div>

    <div id="fileList" class="card glass" style="display:none;margin-bottom:22px">
      <h3 style="margin-bottom:12px">已上传文件（可单独删除某一份）</h3>
      <div id="fileListBody"></div>
    </div>

    <div id="empty" class="card glass" style="text-align:center;padding:40px">
      <p class="muted">还没有数据。去 <a href="upload2.html">上传数据</a> 传一份试试。</p>
    </div>

    <div id="board" style="display:none">
      <div class="kpi-grid cols5" id="kpis"></div>

      <div class="charts-2" style="margin-top:20px">
        <div class="chart-wrap glass">
          <h3 id="shopTitle">各店铺销售额 Top</h3>
          <canvas id="shopChart" height="300"></canvas>
        </div>
        <div class="chart-wrap glass">
          <h3 id="monthTitle">月份销售额趋势</h3>
          <canvas id="monthChart" height="300"></canvas>
        </div>
      </div>

      <div class="charts-2" style="margin-top:20px">
        <div class="chart-wrap glass">
          <h3 id="catTitle">品类销售额 Top</h3>
          <canvas id="catChart" height="300"></canvas>
        </div>
        <div class="chart-wrap glass">
          <h3>销售等级分布</h3>
          <canvas id="gradeChart" height="300"></canvas>
        </div>
      </div>

      <div class="chart-wrap glass" style="margin-top:20px">
        <h3>数据预览（前 50 行）</h3>
        <div id="tableWrap" style="font-size:12px"></div>
      </div>
    </div>
  </main>

  <script src="js/app.js?v=3"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/supabase-api.js?v=3"></script>
  <script src="js/mydata.js?v=3"></script>
</body>
</html>
